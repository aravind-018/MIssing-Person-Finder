<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>GodsEye</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 420px;
        }

        .logo {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 4px;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            margin-bottom: 35px;
        }

        .progress {
            width: 100%;
            height: 12px;
            border-radius: 20px;
            background: rgba(255,255,255,.12);
            overflow: hidden;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,#2563eb,#38bdf8);
            animation: load 6s linear forwards;
        }

        @keyframes load {
            from { width:0%; }
            to { width:100%; }
        }

        .status{
            margin-top:20px;
            color:#cbd5e1;
            font-size:15px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="logo">
🛡
</div>

<h1>GodsEye</h1>

<p>AI Missing Person Identification System</p>

<div class="progress">

<div class="bar"></div>

</div>

<div class="status" id="status">

Initializing...

</div>

</div>

<script>

const messages=[
"Initializing AI Engine...",
"Loading Database...",
"Starting Backend...",
"Preparing Dashboard...",
"Launching GodsEye..."
];

let i=0;

setInterval(()=>{

document.getElementById("status").innerText=messages[i];

i++;

if(i>=messages.length)
i=messages.length-1;

},1200);

</script>

</body>

</html>
